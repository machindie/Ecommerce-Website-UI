<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Bonfire - Product Page
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f7f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
        }
        /* HEADER UMUM */
        header {
            position: fixed; /* Header tetap di atas halaman */
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between; /* Logo di kiri, menu di kanan */
            align-items: center;
            background-color: #ffffff; /* Latar belakang putih */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000; /* Pastikan header berada di atas elemen lainnya */
        }

        /* LOGO */
        header .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333; /* Warna teks gelap */
            margin-right: 40px;
        }

        header .logo img {
            max-width: 120px; /* Atur lebar maksimum logo */
            height: auto;
        }

        /* NAVIGASI MENU */
        nav {
            flex-grow: 1; /* Membiarkan nav mengambil ruang yang tersedia */
        }

        nav ul {
            list-style: none; /* Hilangkan bullet */
            display: flex; /* Tampilkan menu dalam satu baris */
            justify-content: flex-start; /* Menempel ke kiri */
            margin: 0;
            padding: 0;
            gap: 20px; /* Jarak antar item menu */
        }

        nav ul li a {
            text-decoration: none; /* Hilangkan garis bawah */
            color: #333; /* Warna teks */
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #888; /* Warna saat hover */
        }

        /* IKON LOGIN */
        .login-icon {
            margin-left: auto; /* Menempelkan ikon ke sisi kanan */
        }

        .login-icon img {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .login-icon img:hover {
            transform: scale(1.1);
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-icon {
            margin-right: 20px; /* Memberi jarak ke kanan dari ikon search */
        }
        .search-icon img {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .search-icon img:hover {
            transform: scale(1.1);
        }

        .search-bar-container {
            position: fixed;
            top: 60px; /* Di bawah header */
            right: 20px; /* Dekat dengan ikon search */
            display: none; /* Tersembunyi secara default */
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 10px;
            border-radius: 4px;
            z-index: 1000;
        }

        .search-bar-container input {
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #b0b0b0;
            border-radius: 4px;
            width: 300px;
        }

        .search-bar-container button {
            background-color: #001f3f;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 5px;
        }
        .search-bar-container button:hover {
            background-color: #003366;
        }

        .cart-icon {
            margin-left: 20px;
        }
        .cart-icon img {
            width: 32px; /* Sesuaikan ukuran dengan ikon lainnya */
            height: 32px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cart-icon img:hover {
            transform: scale(1.1); /* Efek saat ikon disentuh */
        }

        /* Jarak antara header dan konten */
        main {
            margin-top: 30px; /* Jarak konten di bawah header */
            padding: 20px;
        }
        .product {
            display: flex;
            gap: 40px;
            padding: 40px 0;
        }
        .product .image-gallery {
            flex: 1;
        }
        .product .image-gallery img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }
        .product .details {
            flex: 2;
        }
        .product .details h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .product .details .price {
            font-size: 20px;
            color: #4990e2;
            margin-bottom: 10px;
        }
        .product .details .availability {
            margin-bottom: 20px;
        }
        .product .details .description {
            margin-bottom: 20px;
        }
        .product .details .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .product .details .options select,
        .product .details .options input {
            padding: 10px;
            border: 1px solid #eaeaea;
            border-radius: 5px;
            width: 100px;
        }
        .product .details .actions {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .product .details .actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .product .details .actions .add-to-cart {
            background-color: #000;
            color: #fff;
        }
        .product .details .actions .add-to-wishlist {
            background-color: #f5f7f9;
            color: #333;
            border: 1px solid #eaeaea;
        }
        .product .details .share {
            display: flex;
            gap: 10px;
        }
        .product .details .share a {
            text-decoration: none;
            color: #333;
        }
        .footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #eaeaea;
            margin-top: 40px;
        }
  </style>
 </head>
<body>
    <main>
    <!-- Header -->
    <header>
        <div class="logo">
            <!-- Ganti URL gambar dengan URL logo yang Anda inginkan -->
            <img src="tentrovelogo.png" alt="Logo Ecommere">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="products.html">Produk</a></li>
                <li><a href="men.html">Pria</a></li>
                <li><a href="woman.html">Wanita</a></li>
                <li><a href="sale.html">Promo</a></li>
                <li><a href="about.html">Tentang</a></li>
                <li><a href="contact.html">Kontak</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <div class="search-icon">
                <img src="cari.png" alt="Search" id="search-icon">
            </div>
        <div class="login-icon">
            <a href="login.html">
                <img src="login.png" alt="Login" class="icon">
            </a>
        </div>
        <div class="cart-icon">
            <a href="cart.html">
                <img src="logocart.png" alt="Keranjang" class="icon">
            </a>
        </div>
   </header>
   <div class="product">
    <div class="image-gallery">
     <img alt="Main product image of a tailored coat" height="800" src="kemejacowo3.jpeg" width="600"/>
    </div>
    <div class="details">
     <a href="produkcowok.html">
      Kembali
     </a>
     <h1>
      Kemeja Pria
     </h1>
     <div class="price">
      Rp. 156.000
     </div>
     <div class="availability">
      Tersedia Stok
     </div>
     <div class="description">
      <p>
       Kode Produk: 43890
      </p>
      <p>
       Bahan: Cotton &amp; Wool
      </p>
      <p>
       Care: Dry clean only
      </p>
      <p>
       Ukuran: S
      </p>
      <p>
       Made in Indonesia
      </p>
     </div>
     <div class="options">
      <div class="color">
       <label for="color">
        Wana
       </label>
       <select id="color">
        <option>
         Putih
        </option>
        <option>
         Abu - Abu
        </option>
        <option>
         Sage
        </option>
       </select>
      </div>
      <div class="size">
       <label for="size">
        Size
       </label>
       <select id="size">
        <option>
         S
        </option>
        <option>
         M
        </option>
        <option>
         L
        </option>
       </select>
      </div>
      <div class="quantity">
       <label for="quantity">
        Qty
       </label>
       <input id="quantity" type="number" value="1"/>
      </div>
     </div>
     <div class="actions">
    <a href="cart.html">
      <button class="Tambahkan ke Keranjang">
       Keranjang
      </button>
    </a>
      <button class="Tambahkan ke Daftar">
       Daftar
      </button>
     </div>
     <div class="share">
      <a href="#">
       <i class="fab fa-facebook-f">
       </i>
      </a>
      <a href="#">
       <i class="fab fa-twitter">
       </i>
      </a>
      <a href="#">
       <i class="fab fa-pinterest-p">
       </i>
      </a>
      <a href="#">
       <i class="fab fa-google-plus-g">
       </i>
      </a>
     </div>
    </div>
   </div>
    </main>
  </div>
 </body>
</html>
